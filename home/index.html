<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect your account • Willbot.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{--brand:#30ff96;--bg:#0d0d0d;--card:rgba(255,255,255,.05);--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Poppins,sans-serif;background:var(--bg);color:#fff;
      display:flex;flex-direction:column;align-items:center;padding:4rem 1rem;min-height:100vh
    }
    img{width:180px;margin-bottom:3rem}
    .card{
      width:100%;max-width:480px;background:var(--card);backdrop-filter:blur(8px);
      border-radius:var(--radius);padding:2rem;text-align:center;
      box-shadow:0 4px 40px rgba(0,0,0,.4)
    }
    h1{font-size:1.6rem;font-weight:600;margin-bottom:1.25rem}
    button{
      cursor:pointer;appearance:none;border:none;border-radius:var(--radius);
      padding:.9rem 1.6rem;font-size:1rem;font-weight:600;color:#0d0d0d;background:var(--brand);
      transition:transform .15s,box-shadow .15s
    }
    button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(48,255,150,.3)}
    iframe{
      width:100%;height:620px;border:0;border-radius:var(--radius)
    }
    .msg{margin-top:1.25rem;font-size:.9rem;color:#aaa}
  </style>
</head>
<body>

  <img src="https://static.wixstatic.com/media/f63745_d8e0946dd69d41b2a45980229cc1d5f2~mv2.png/v1/crop/x_7,y_20,w_397,h_135/fill/w_194,h_68,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Screenshot%202023-08-12%20at%201_45_33%20PM.png" alt="Willbot.ai">

  <div class="card" id="card">
    <h1>Connect your account</h1>

    <button id="connect">Get&nbsp;Started</button>

    <p class="msg">You’ll be asked to log in to LinkedIn and grant access.<br>
      The process takes about&nbsp;60&nbsp;seconds.</p>
  </div>

  <script>
    const connectBtn = document.getElementById('connect');
    const card       = document.getElementById('card');

    async function startFlow(){
      connectBtn.textContent='Generating link…';
      connectBtn.style.pointerEvents='none'; connectBtn.style.opacity='.6';

      try{
        // 🔗 Replace with YOUR Make webhook base
        const uid  = `anon-${Date.now()}`;                // auto-generated ID
        const hook = `https://hook.us1.make.com/puhr1531og4uavlcuk8fnbrbx5dtofaw?uid=${encodeURIComponent(uid)}`;

        const res  = await fetch(hook);
        if(!res.ok) throw new Error('Webhook error');
        const authUrl = (await res.text()).trim();

        card.innerHTML = `<iframe src="${authUrl}" allow="clipboard-write camera microphone"></iframe>`;
      }catch(err){
        alert('Sorry, something went wrong. Please try again.');
        connectBtn.textContent='Get Started'; connectBtn.style.pointerEvents=''; connectBtn.style.opacity='';
      }
    }

    connectBtn.addEventListener('click', startFlow);
  </script>
</body>
</html>

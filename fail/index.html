<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connection failed • Willbot.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{--brand:#30ff96;--bg:#0d0d0d;--card:rgba(255,255,255,.05);--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Poppins,sans-serif;background:var(--bg);color:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100vh;padding:1.5rem
    }
    img{width:160px;margin-bottom:2.5rem}
    .card{
      background:var(--card);backdrop-filter:blur(8px);border-radius:var(--radius);
      padding:2.5rem;text-align:center;max-width:420px;width:100%;
      box-shadow:0 4px 40px rgba(0,0,0,.4)
    }
    h1{font-size:1.6rem;font-weight:600;margin-bottom:1rem}
    p {font-size:.95rem;color:#aaa;margin-bottom:2.2rem;line-height:1.5}
    a.button{
      display:inline-block;text-decoration:none;font-weight:600;
      background:var(--brand);color:#0d0d0d;padding:.9rem 1.6rem;
      border-radius:var(--radius);transition:transform .15s,box-shadow .15s
    }
    a.button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(48,255,150,.3)}
  </style>
</head>
<body>

  <img src="https://static.wixstatic.com/media/f63745_d8e0946dd69d41b2a45980229cc1d5f2~mv2.png/v1/crop/x_7,y_20,w_397,h_135/fill/w_194,h_68,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Screenshot%202023-08-12%20at%201_45_33%20PM.png" alt="Willbot.ai">

  <div class="card">
    <h1>Something went wrong</h1>
    <p>We couldn’t complete the connection. Please go back and try again, or contact support if the issue persists.</p>
    <a class="button" href="https://connect.willbot.ai" target="_top">Retry</a>
  </div>

</body>
</html>
